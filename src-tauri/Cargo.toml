[package]
name = "floorplan-cad"
version = "1.0.0"
description = "FloorPlan CAD Desktop Application"
authors = ["3ROOMS Team"]
edition = "2021"

[lib]
name = "floorplan_cad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
